[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentfw"
version = "0.1.0"
description = "Role-based multi-agent framework with plug-in platform skill packs"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0,<7",
    "jsonschema[format]>=4.18,<5",
    "referencing>=0.30",
    "langchain>=1.4,<2",
    "langchain-core>=1.6,<2",
    "langchain-openai>=1.6,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "langchain-text-splitters>=1.1,<2",
    "langchain-chroma>=1.1,<2",
    "chromadb>=1.5,<2",
    "fastembed>=0.8,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fw = "agentfw.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentfw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests use the real embedding model and the real RideXpress docs: pytest -m integration
addopts = "-m 'not integration'"
markers = ["integration: needs the downloaded embedding model and the RideXpress checkout"]
