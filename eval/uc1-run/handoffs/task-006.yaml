  description: 'Build the iOS sign-up screen with email, phone, password, first name, and last name fields.
    Implement client-side validation that rejects invalid email format with message ''Please enter a valid
    email address.'' and invalid phone format with message ''Please enter a valid phone number with country
    code.''. On valid input, submit registration payload to POST /user endpoint. Display server errors:
    duplicate email error with ''Go to Login'' button, identity provider unavailable error, and other
    validation errors.'
  acceptance_criteria:
  - Sign-up screen implemented at RideXpress/Features/SignUp with fields for email, phone, password, firstName,
    lastName
  - Client-side email validation shows 'Please enter a valid email address.' for invalid format
  - Client-side phone validation shows 'Please enter a valid phone number with country code.' for invalid
    format
  - On valid input, submits POST /user with JSON {email, phone, password, firstName, lastName}
  - Displays duplicate email error 'This email is already registered. Please log in or use a different
    email.' with 'Go to Login' button that navigates to login screen
  - Displays identity provider unavailable error 'Registration service is temporarily unavailable. Please
    try again in a few minutes.'
  - Displays other validation error messages from server
  - Unit tests cover validation logic and error display
  files_hint:
  - RideXpress/Features/SignUp/SignUpView.swift
  - RideXpress/Features/SignUp/SignUpViewModel.swift
  - RideXpress/Features/SignUp/SignUpViewModelTests.swift
