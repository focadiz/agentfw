  description: Define the RAML contract for Database System API with POST /users for user record creation
    and verification code storage. The contract must specify request {userName, email, mobile, firstName,
    lastName, userType} and response 201 {id, userId}, plus verification codes table operations with 6-digit
    code and expiration timestamp.
  acceptance_criteria:
  - RAML file created/updated at mulesoft/design-center/database-system-api/database-system-api.raml
  - POST /users endpoint defined with request {userName, email, mobile, firstName, lastName, userType}
    and 201 {id, userId} response
  - Verification codes table operations defined (store 6-digit code with 10-min TTL, retrieve by email/userId)
  - 409 response for duplicate email constraint documented
  - RAML validates without errors
  files_hint:
